<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10141d"><title>PC DROP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e121a;--panel:#171e2a;--panel2:#202a3a;--text:#f4f7fc;--muted:#9ba9bd;--blue:#579bff;--line:#2b3648}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2940 0,#0e121a 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}button{font:inherit;border:0;cursor:pointer}.app{max-width:720px;margin:auto;padding:16px 14px 92px}.top{display:flex;align-items:center;gap:12px;margin:6px 0 18px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#5da5ff,#7655d9);font-size:25px;box-shadow:0 8px 28px #438bff30}.brand{flex:1}.brand h1{font-size:21px;margin:0;letter-spacing:.5px}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}.balance{background:#24382f;border:1px solid #335846;border-radius:13px;padding:10px 12px;color:#9af0bb;font-weight:800;font-size:13px}.hero{background:linear-gradient(130deg,#233b62,#35275e 70%,#25223e);border:1px solid #425b84;border-radius:23px;padding:20px;position:relative;overflow:hidden;box-shadow:0 12px 35px #0002}.hero:after{content:'⬡';position:absolute;right:6px;top:-48px;font-size:190px;color:#ffffff08;pointer-events:none}.eyebrow{font-size:11px;color:#c7dcff;letter-spacing:1.8px;font-weight:800}.hero h2{font-size:25px;line-height:1.1;margin:9px 0}.hero p{font-size:13px;color:#d0ddf4;max-width:300px;line-height:1.5;margin:0 0 17px}.primary{background:linear-gradient(90deg,#66adff,#8c79ff);color:white;border-radius:13px;padding:13px 17px;font-weight:850;box-shadow:0 6px 18px #5a85ff35}.primary:disabled{opacity:.5}.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 12px}.section-head h3{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:14px 5px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700}.quick i{font-style:normal;font-size:23px}.quick button.active{border-color:var(--blue);background:#1d2b40}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{min-width:0;background:linear-gradient(150deg,#1b2432,#141a24);border:1px solid var(--line);border-radius:17px;padding:12px;position:relative;overflow:hidden}.art{height:100px;border-radius:12px;display:grid;place-items:center;font-size:45px;background:radial-gradient(circle at 50% 35%,#526f9c55,#26364a 70%);margin-bottom:11px}.card h4{font-size:13px;margin:0 0 6px;line-height:1.35}.tag{display:inline-block;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800;background:#2a3443;color:#aebbd0}.tag.rare{background:#203d61;color:#85beff}.tag.epic{background:#3b2c5d;color:#d2adff}.tag.legend{background:#584022;color:#ffd080}.tag.myth{background:#51294d;color:#ff9fe4}.tag.uncommon{background:#214633;color:#8cebb0}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px}.power{font-size:11px;color:var(--muted)}.smallbtn{border:1px solid #405575;background:#233750;color:#c5ddff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}.empty{grid-column:1/-1;border:1px dashed #364255;border-radius:16px;padding:28px 15px;text-align:center;color:var(--muted);font-size:13px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#10151ff2;border-top:1px solid var(--line);backdrop-filter:blur(16px);padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}.tabs-inner{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:min(720px,100%)}.tab{background:transparent;color:var(--muted);padding:7px 2px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}.tab b{font-size:20px;font-weight:500}.tab.active{background:#24334a;color:#d9e8ff}.notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#26374d;border:1px solid #425a7b;color:#fff;border-radius:12px;padding:12px 15px;z-index:30;width:calc(100% - 30px);max-width:450px;font-size:13px;box-shadow:0 10px 30px #0005}.subtext{font-size:12px;color:var(--muted);line-height:1.5}.buildslot{background:var(--panel);border:1px dashed #3b4960;border-radius:13px;padding:13px;margin-bottom:8px}.buildslot strong{display:block;font-size:12px;margin-bottom:5px}.buildslot select{width:100%;background:#222d3e;border:1px solid #3b4960;color:white;border-radius:9px;padding:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#1a2432;border-radius:12px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.hidden{display:none!important}
</style></head><body><main class="app"><header class="top"><div class="logo">🖥️</div><div class="brand"><h1>PC DROP</h1><p>Собирай. Улучшай. Коллекционируй.</p></div><div class="balance" id="balance">500 ₵</div></header><div id="view"></div></main><nav class="tabs"><div class="tabs-inner"><button class="tab active" data-page="home"><b>⌂</b>Главная</button><button class="tab" data-page="inventory"><b>▦</b>Карточки</button><button class="tab" data-page="build"><b>▣</b>Сборка ПК</button><button class="tab" data-page="shop"><b>🛒</b>Магазин</button></div></nav><div id="notice" class="notice hidden"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#10141d');tg.setBackgroundColor('#0e121a')}catch(e){}}
let state={user:{id:0,balance:500,last_drop:0,last_daily:0},inventory:[],catalog:[],build:{}};let page='home';const rarityClass={'Необычная':'uncommon','Редкая':'rare','Эпическая':'epic','Легендарная':'legend','Мифическая':'myth'};const icons={Видеокарта:'🎮',Процессор:'🧠','Материнская плата':'🧩','Оперативная память':'💾',Накопитель:'⚡','Блок питания':'🔋',Корпус:'🖥️',Охлаждение:'❄️'};
function authHeaders(){const h={'Content-Type':'application/json'};if(tg?.initData)h['x-telegram-init-data']=tg.initData;else h['x-dev-user-id']='10001';return h}
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:authHeaders(),body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({detail:'Не удалось прочитать ответ'}));if(!r.ok)throw new Error(data.detail||'Ошибка запроса');return data}
function toast(s){const n=document.getElementById('notice');n.textContent=s;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),2800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtWait(ts,period){const left=period-(Math.floor(Date.now()/1000)-ts);if(left<=0)return 'Доступно сейчас';return `Через ${Math.floor(left/3600)} ч ${Math.floor((left%3600)/60)} мин`}
function cardHtml(c,owned=false){return `<article class="card"><div class="art">${icons[c.type]||'🧩'}</div><h4>${esc(c.name)}</h4><span class="tag ${rarityClass[c.rarity]||''}">${esc(c.rarity)}</span><div class="card-bottom"><span class="power">⚡ Сила ${c.power}</span>${owned?`<button class="smallbtn" onclick="sell(${c.inventory_id})">Продать · ${c.price}₵</button>`:''}</div></article>`}
function header(title,subtitle=''){return `<div class="section-head"><h3>${title}</h3><span>${subtitle}</span></div>`}
function render(){document.getElementById('balance').textContent=`${state.user.balance} ₵`;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=document.getElementById('view');if(page==='home')v.innerHTML=`<section class="hero"><div class="eyebrow">ТВОЯ КОЛЛЕКЦИЯ ЖДЁТ</div><h2>Поймай редкое<br>железо 🎁</h2><p>Открывай дропы, собирай комплектующие и создай ПК своей мечты.</p><button class="primary" id="dropBtn">🎁 Открыть дроп</button><div class="subtext" style="margin-top:10px">${fmtWait(state.user.last_drop,10800)}</div></section>${header('Быстрый доступ','')}<div class="quick"><button onclick="go('inventory')"><i>🎒</i>Инвентарь</button><button onclick="daily()"><i>📅</i>Награда +250₵</button><button onclick="go('build')"><i>🖥️</i>Моя сборка</button></div>${header('Коллекция','Последние карточки')}<div class="cards">${state.inventory.slice(0,4).map(c=>cardHtml(c,true)).join('')||'<div class="empty">Здесь пока пусто. Открой первый дроп!</div>'}</div>`;
else if(page==='inventory')v.innerHTML=`${header('Твои карточки',`${state.inventory.length} шт.`)}<p class="subtext">Повторные карточки можно продать за игровую валюту.</p><div class="cards">${state.inventory.map(c=>cardHtml(c,true)).join('')||'<div class="empty">Инвентарь пуст.<br>Вернись на главную и открой дроп 🎁</div>'}</div>`;
else if(page==='shop')v.innerHTML=`${header('Магазин','Покупки скоро')}<div class="hero"><div class="eyebrow">МАГАЗИН КОМПЛЕКТУЮЩИХ</div><h2>Собирай свою коллекцию</h2><p>В этой первой версии магазин пока в разработке. Сейчас можно получать карточки из дропов и продавать их.</p><button class="primary" onclick="go('home')">Вернуться к дропу</button></div>${header('Витрина','Каталог')}<div class="cards">${state.catalog.slice(0,6).map(c=>cardHtml(c,false)).join('')}</div>`;
else if(page==='build'){const slots=[['gpu','Видеокарта'],['cpu','Процессор'],['board','Материнская плата'],['ram','Оперативная память'],['ssd','Накопитель'],['psu','Блок питания'],['cooler','Охлаждение'],['case','Корпус']];let score=0;const opts=slots.map(([k,label])=>{const chosen=state.inventory.find(c=>String(c.inventory_id)===String(state.build[k]));if(chosen)score+=chosen.power;const choices=state.inventory.filter(c=>c.type===label|| (k==='board'&&c.type==='Материнская плата') || (k==='ram'&&c.type==='Оперативная память'));return `<div class="buildslot"><strong>${label}</strong><select onchange="setBuild('${k}',this.value)"><option value="">— Не установлено —</option>${choices.map(c=>`<option value="${c.inventory_id}" ${String(state.build[k])===String(c.inventory_id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`}).join('');v.innerHTML=`${header('Сборка компьютера','Подбери детали')}<p class="subtext">Выбирай компоненты из своего инвентаря. В этой версии считаем общую силу деталей; расширенную проверку совместимости добавим следующим этапом.</p>${opts}<div class="stats"><div class="stat"><b>${score}</b><span>Сила сборки</span></div><div class="stat"><b>${Object.keys(state.build).length}</b><span>Установлено</span></div><div class="stat"><b>${state.inventory.length}</b><span>Карточек</span></div></div><button class="primary" style="width:100%;margin-top:12px" onclick="saveBuild()">Сохранить сборку</button>`}}
function go(p){page=p;render()}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
async function refresh(){try{state=await api('/api/state');render()}catch(e){toast(e.message+' — открой приложение через Telegram после публикации.');render()}}
async function drop(){const b=document.getElementById('dropBtn');if(b){b.disabled=true;b.textContent='Открываем…'}try{const d=await api('/api/drop','POST',{});state=d.state;render();toast(`🎉 Выпала карточка: ${d.card.name} · ${d.card.rarity}`)}catch(e){toast(e.message)}finally{const btn=document.getElementById('dropBtn');if(btn){btn.disabled=false;btn.textContent='🎁 Открыть дроп'}}}
async function sell(id){try{state=await api('/api/sell/'+id,'POST',{});render();toast('Карточка продана!')}catch(e){toast(e.message)}}
async function daily(){try{state=await api('/api/daily','POST',{});render();toast('🎉 Получено +250 ₵')}catch(e){toast(e.message)}}
function setBuild(k,v){if(v)state.build[k]=v;else delete state.build[k]}
async function saveBuild(){try{state=await api('/api/build','POST',{selected:state.build});render();toast('Сборка сохранена!')}catch(e){toast(e.message)}}
document.addEventListener('click',e=>{if(e.target?.id==='dropBtn')drop()});refresh();
</script></body></html>
